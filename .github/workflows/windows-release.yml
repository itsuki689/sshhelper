name: Publish sshhelper Windows Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on master, for example v2.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/windows-ci.yml
    with:
      build_ref: ${{ inputs.tag || github.ref_name }}
      release_tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sshhelper-windows-${{ github.run_id }}
          path: release
      - name: Publish tested package and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf '%s\n' \
            'Windows x64 portable package. Extract the complete ZIP and run start.bat.' \
            'SHA256SUMS verifies the ZIP; dist/SHA256SUMS inside verifies both EXEs.' \
            'Authenticode signing is skipped for this release; inspect build-info.json for each EXE status.' \
            'Data is stored in %LOCALAPPDATA%\sshhelper. Source and CI are recorded in build-info.json.' > release-notes.txt
          gh release create "$RELEASE_TAG" release/* --verify-tag \
            --title "sshhelper $RELEASE_TAG" --notes-file release-notes.txt
